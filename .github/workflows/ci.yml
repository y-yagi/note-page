name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6.0.10
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'pnpm'
    - name: Run pnpm install
      run: pnpm install
    - name: Run prettier
      run: pnpm pretty-check
    - name: Run eslint
      run: pnpm lint

